<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:* ws://localhost:* https://api.github.com https://registry.smithery.ai https://raw.githubusercontent.com https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/mcp-dock.svg" />
    <!-- 字体非阻塞加载：弱网/被墙时不阻塞首屏文本渲染（避免 FOIT）。
         print 媒体先在后台加载，加载完成后切为 all 应用样式；display=swap 兜底。 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <title>AI-Tools</title>
    <!-- 在首屏绘制前根据持久化主题设置 dark 类，避免浅色用户看到暗色闪烁 -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('mcp-dock-store');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null;
          if (!theme || (theme !== 'light' && theme !== 'dark' && theme !== 'auto')) theme = 'auto';
          var dark = theme === 'auto'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : theme === 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* 失败则保持 index.html 默认 dark */ }
      })();
    </script>
  </head>
  <body class="bg-surface-950 text-surface-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
