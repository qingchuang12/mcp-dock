<script id="cats" type="application/json">["AIGC", "Knowledge&Memory", "Search", "aigc", "art-and-culture", "browser-automation", "calendar-management", "cloud-platforms", "communication", "content-management-systems", "databases", "developer-tools", "entertainment-and-media", "file-systems", "finance", "image-and-video-processing", "knowledge-and-memory", "location-services", "monitoring", "note-taking", "os-automation", "other", "research-and-data", "search", "travel-and-transportation", "version-control"]</script>
<script>
const MK=JSON.parse(document.getElementById('db').textContent);
const CATS=JSON.parse(document.getElementById('cats').textContent);
let sel=null,page=1;
const catSel=document.getElementById('cat');
CATS.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');document.getElementById('p-'+t.dataset.t).classList.add('active');
});
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){
  const kw=document.getElementById('q').value.trim().toLowerCase();
  const cat=catSel.value, sort=document.getElementById('sort').value, ps=+document.getElementById('psize').value;
  let list=MK.filter(s=>{
    if(cat&&(s.cats||'').indexOf(cat)<0)return false;
    if(kw){const h=(s.id+' '+s.name+' '+s.en+' '+s.desc+' '+s.cats).toLowerCase();if(h.indexOf(kw)<0)return false;}
    return true;
  });
  if(sort==='vw')list.sort((a,b)=>b.vw-a.vw);
  else if(sort==='en')list.sort((a,b)=>a.en.localeCompare(b.en));
  else list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  const pages=Math.max(1,Math.ceil(list.length/ps));if(page>pages)page=pages;
  const slice=list.slice((page-1)*ps,page*ps);
  document.getElementById('metaLine').textContent=`匹配 ${list.length} / 共 ${MK.length} 个 · 第 ${page}/${pages} 页`;
  const grid=document.getElementById('grid');grid.innerHTML='';
  if(!slice.length){grid.innerHTML='<div class="empty">没有匹配的结果</div>';}
  slice.forEach(s=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<h3>${esc(s.name)}</h3><span class="badge">${esc(s.cats||'未分类')}</span>
      <div class="mstat"><span>浏览 <b>${s.vw.toLocaleString()}</b></span></div>
      <div class="desc">${esc(s.desc)}</div><div style="font-size:11px;color:var(--sub)">${esc(s.id)}</div>`;
    c.onclick=()=>openDetail(s);
    grid.appendChild(c);
  });
  const pg=document.getElementById('pager');pg.innerHTML='';
  const mk=(t,p,d)=>{const b=document.createElement('button');b.textContent=t;b.disabled=d;b.onclick=()=>{page=p;render();};return b;};
  pg.appendChild(mk('上一页',page-1,page<=1));pg.appendChild(mk(`${page}/${pages}`,page,true));pg.appendChild(mk('下一页',page+1,page>=pages));
}
function openDetail(s){
  sel=s;
  document.getElementById('detailBody').innerHTML=`
    <h3 style="margin:0 0 6px">${esc(s.name)} <span class="badge">${esc(s.cats||'未分类')}</span></h3>
    <div class="kv"><span class="k">id</span><span class="v"><code>${esc(s.id)}</code></span></div>
    <div class="kv"><span class="k">英文名</span><span class="v">${esc(s.en)}</span></div>
    <div class="kv"><span class="k">浏览量</span><span class="v"><b>${s.vw.toLocaleString()}</b></span></div>
    <div class="kv"><span class="k">分类</span><span class="v">${esc(s.cats)||'—'}</span></div>
    <div class="kv"><span class="k">简介</span><span class="v">${esc(s.desc)}</span></div>
    <div class="kv"><span class="k">source_url</span><span class="v">${s.src?`<a class="link" href="${esc(s.src)}" target="_blank" rel="noopener">${esc(s.src)}</a>`:'（空）'}</span></div>
    <button class="btn gold" onclick="openInstall()">去安装 →</button>`;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
  document.querySelector('.tab[data-t=detail]').classList.add('active');
  document.getElementById('p-detail').classList.add('active');
}
function openInstall(){
  const s=sel;if(!s){return;}
  const cfg=`{
  "mcpServers": {
    "${esc(s.en||s.id)}": {
      "command": "uvx",
      "args": ["<server-package>"]
    }
  }
}`;
  document.getElementById('installBody').innerHTML=`
    <div class="flow">
      <div class="step"><span class="num">1</span> 取详情 <code>server_config</code>（command/args）</div>
      <div class="step"><span class="num">2</span> 写入 mcp 客户端配置</div>
      <div class="step"><span class="num">3</span> uvx/npx 运行时自动拉起，无需下载二进制</div>
    </div>
    <div class="kv"><span class="k">source_url</span><span class="v">${s.src?`<a class="link" href="${esc(s.src)}" target="_blank" rel="noopener">${esc(s.src)}</a>`:'（空）'}</span></div>
    <div class="kv"><span class="k">安装模板</span><span class="v">取详情 server_config → command + args</span></div>
    <div class="codebox">${cfg}</div>
    <div class="note" style="background:rgba(110,168,254,.07);border-color:var(--line)">⚠ 真实 <code>server_config</code> 需对该 id 调 <code>GET /openapi/v1/mcp/servers/&lt;id&gt;</code> 获取（本列表为匿名第1页，未含 server_config 字段；抽样详情见配套文档）。</div>`;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
  document.querySelector('.tab[data-t=install]').classList.add('active');
  document.getElementById('p-install').classList.add('active');
}
[document.getElementById('q'),catSel,document.getElementById('sort'),document.getElementById('psize')].forEach(el=>el.addEventListener('input',()=>{page=1;render();}));
render();
</script></body></html>
