<script>
const DB=JSON.parse(document.getElementById('data').textContent);
const servers=DB.servers,cats=DB.categories,sources=DB.sources;
document.getElementById('subline').textContent=`离线索引 ${DB.total} 个 · ${cats.length} 类 · ${sources.length} 来源 · 数据快照 2026-08-17`;
const zhOf={};cats.forEach(c=>zhOf[c.slug]=c.zh||c.slug);
const catSel=document.getElementById('cat'),srcSel=document.getElementById('src');
cats.forEach(c=>{const o=document.createElement('option');o.value=c.slug;o.textContent=`${c.zh} · ${c.slug} (${c.count})`;catSel.appendChild(o);});
sources.forEach(s=>{const o=document.createElement('option');o.value=s.slug;o.textContent=`${s.zh} · ${s.slug} (${s.count})`;srcSel.appendChild(o);});
const enumBox=document.getElementById('enum');
cats.forEach(c=>{const el=document.createElement('div');el.className='chip';el.innerHTML=`${c.zh} · ${c.slug} <b>${c.count}</b>`;el.onclick=()=>{catSel.value=c.slug;render();};enumBox.appendChild(el);});
let page=1;const q=document.getElementById('q'),sort=document.getElementById('sort'),psize=document.getElementById('psize');
[q,catSel,srcSel,sort,psize].forEach(el=>el.addEventListener('input',()=>{page=1;render();}));
function render(){
  const kw=q.value.trim().toLowerCase();const cat=catSel.value;const src=srcSel.value;
  let list=servers.filter(s=>{
    if(cat&&!(s.categories||[]).includes(cat))return false;
    if(src&&s.source!==src)return false;
    if(kw){const hay=(s.name+' '+(s.cn||'')+' '+s.desc+' '+((s.categories_zh||[]).join(' '))+' '+s.sourceZh+' '+s.publisher).toLowerCase();if(!hay.includes(kw))return false;}
    return true;});
  if(sort.value==='views')list.sort((a,b)=>b.views-a.views);
  else if(sort.value==='acts')list.sort((a,b)=>b.acts-a.acts);
  else list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  const ps=+psize.value;const pages=Math.max(1,Math.ceil(list.length/ps));if(page>pages)page=pages;
  const slice=list.slice((page-1)*ps,page*ps);
  document.getElementById('subline').textContent=`匹配 ${list.length} 个 · 第 ${page}/${pages} 页 · 离线索引 ${DB.total} 个`;
  const grid=document.getElementById('grid');grid.innerHTML=slice.length?'':'<div class="empty">没有匹配的结果</div>';
  slice.forEach(s=>{
    const tags=(s.tags||[]).slice(0,4).map(t=>`<span class="badge o">${esc(t)}</span>`).join('');
    const cats2=(s.categories_zh||[]).slice(0,3).map(c=>`<span class="badge">${esc(c)}</span>`).join('');
    const src2=`<span class="badge g">${esc(s.sourceZh||s.source)}</span>`;
    const biz=s.cn?`<span class="badge">${esc(s.cn)}</span>`:'';
    const logo=s.logo?`<img class="logo" src="${esc(s.logo)}" onerror="this.style.display='none'">`:'<div class="logo"></div>';
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`<div class="top">${logo}<div><h3>${esc(s.name)}</h3><div style="color:var(--sub);font-size:12px">${esc(s.serverCode||'')}</div></div></div>
      <div class="meta"><span>调用 <b>${s.views.toLocaleString()}</b></span><span>激活用户 <b>${s.acts.toLocaleString()}</b></span><span>部署 <b>${esc(s.deployEnv||'-')}</b></span></div>
      <div>${cats2}${biz}${src2}</div>
      <div class="desc">${esc(s.desc||'')}</div><div>${tags}</div>`;
    grid.appendChild(card);});
  const pager=document.getElementById('pager');pager.innerHTML='';
  const mk=(label,pg,dis)=>{const b=document.createElement('button');b.textContent=label;b.disabled=dis;b.onclick=()=>{page=pg;render();};return b;};
  pager.appendChild(mk('上一页',page-1,page<=1));pager.appendChild(mk(`${page} / ${pages}`,page,true));pager.appendChild(mk('下一页',page+1,page>=pages));
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
render();
</script></body></html>
