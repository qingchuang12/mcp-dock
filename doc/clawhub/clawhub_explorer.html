<script>
const DB=JSON.parse(document.getElementById('data').textContent);
const servers=DB.servers, cats=DB.categories;
document.getElementById('subline').textContent=`离线样例 ${servers.length} 条 · ${cats.length} 个分类 · 快照 ${DB.snapshot}`;
document.getElementById('nTotal').textContent=servers.length;document.getElementById('nCat').textContent=cats.length;
const cnt={};servers.forEach(s=>(s.categories||[]).forEach(c=>cnt[c]=(cnt[c]||0)+1));
const catSel=document.getElementById('cat');
cats.forEach(c=>{const o=document.createElement('option');o.value=c.slug;o.textContent=`${c.slug} · ${c.zh} (采样${c.observed})`;catSel.appendChild(o);});
const enumBox=document.getElementById('enum');
cats.filter(c=>cnt[c.slug]).forEach(c=>{const el=document.createElement('div');el.className='chip';el.innerHTML=`${c.slug} · ${c.zh} <b>${cnt[c.slug]}</b>`;el.onclick=()=>{catSel.value=c.slug;render();};enumBox.appendChild(el);});
let page=1;const q=document.getElementById('q'),sort=document.getElementById('sort'),psize=document.getElementById('psize');
[q,catSel,sort,psize].forEach(el=>el.addEventListener('input',()=>{page=1;render();}));
function render(){
  const kw=q.value.trim().toLowerCase(),cat=catSel.value;
  let list=servers.filter(s=>{
    if(cat&&!(s.categories||[]).includes(cat))return false;
    if(kw){const hay=(s.name+' '+s.summary+' '+s.owner).toLowerCase();if(!hay.includes(kw))return false;}
    return true;});
  const sv=sort.value;
  if(sv==='updated')list.sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
  else list.sort((a,b)=>((b[sv]||0)-(a[sv]||0)));
  const ps=+psize.value,pages=Math.max(1,Math.ceil(list.length/ps));if(page>pages)page=pages;
  const slice=list.slice((page-1)*ps,page*ps);
  document.getElementById('subline').textContent=`匹配 ${list.length} 条 · 第 ${page}/${pages} 页 · 离线样例共 ${servers.length} 条`;
  const grid=document.getElementById('grid');grid.innerHTML=slice.length?'':'<div class="empty">没有匹配的结果（换个关键字或清空筛选试试）</div>';
  slice.forEach(s=>{
    const catB=(s.categories_zh||[]).slice(0,3).map((z,i)=>`<span class="badge" title="${esc(s.categories[i])}">${esc(z)}</span>`).join('');
    const src=s.source?`<span class="badge src">${esc(s.source)}</span>`:'';
    const tr=s.trust?`<span class="badge ok">${esc(s.trust)}</span>`:'';
    const d=s.updated?String(s.updated).slice(0,10):'';
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`<div><h3>${esc(s.name||s.slug)}</h3>${src}${tr}</div>
      <div class="meta"><span>评分 <b>${fmt(s.score)}</b></span><span>下载 <b>${fmt(s.downloads)}</b></span><span>安装 <b>${fmt(s.installs)}</b></span><span>★ <b>${fmt(s.stars)}</b></span>${d?`<span>更新 <b>${d}</b></span>`:''}</div>
      <div>${catB}</div><div class="desc">${esc(s.summary||'')}</div>
      <div class="meta"><span>作者 <b>${esc(s.owner||'—')}</b></span></div>
      ${s.url?`<a class="link" href="https://clawhub.ai${esc(s.url)}" target="_blank" rel="noopener">clawhub.ai${esc(s.url)}</a>`:''}
      <div class="card-actions">
        <button class="btn btn-detail" data-slug="${esc(s.slug)}">📄 详情</button>
        <a class="btn btn-install" href="https://clawhub.ai/api/v1/download?slug=${encodeURIComponent(s.slug)}" target="_blank" rel="noopener" title="下载 zip（CORS 放开，可直接落地）">⬇ 一键安装</a>
      </div>`;
    grid.appendChild(card);});
  const pager=document.getElementById('pager');pager.innerHTML='';
  const mk=(label,pg,dis)=>{const b=document.createElement('button');b.textContent=label;b.disabled=dis;b.onclick=()=>{page=pg;render();};return b;};
  pager.appendChild(mk('上一页',page-1,page<=1));pager.appendChild(mk(`${page} / ${pages}`,page,true));pager.appendChild(mk('下一页',page+1,page>=pages));
}
function fmt(v){v=v??0;return Number(v).toLocaleString();}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* ===== 详情查询 + 一键安装（实时链路，已实测）=====
   GET https://clawhub.ai/api/v1/skills/<slug>   详情，无鉴权，偶发 500（重试可过）
   GET https://clawhub.ai/api/v1/download?slug=  安装，zip，CORS:*，Ratelimit 1200/窗口 */
const detailPanel=document.getElementById('detailPanel'),dpBody=document.getElementById('dpBody');
document.getElementById('dpClose').onclick=()=>detailPanel.style.display='none';
document.addEventListener('click',e=>{
  const b=e.target.closest('.btn-detail');
  if(b&&!e.defaultPrevented){e.preventDefault();showDetail(b.dataset.slug,b.dataset.name);}
});
async function showDetail(slug,name){
  detailPanel.style.display='block';
  detailPanel.scrollIntoView({behavior:'smooth',block:'start'});
  dpBody.innerHTML=`<div class="empty">正在拉取 ${esc(name||slug)} 的详情…（GET /api/v1/skills/${esc(slug)}）</div>`;
  let skill=null,lastErr='';
  for(let i=0;i<3;i++){                       // 详情接口偶发 500，最多重试 3 次
    try{
      const r=await fetch('https://clawhub.ai/api/v1/skills/'+encodeURIComponent(slug),{headers:{Accept:'application/json'}});
      if(r.ok){const j=await r.json();skill=j&&j.skill?j.skill:null;break;}
    }catch(err){lastErr=String(err);}
    if(i<2)await new Promise(res=>setTimeout(res,700));
  }
  renderDetail(skill,slug,lastErr);
}
function renderDetail(skill,slug,lastErr){
  if(!skill){
    dpBody.innerHTML=`<div class="empty">❌ 详情拉取失败（接口偶发 500 或网络被拦）${lastErr?`：<br><code>${esc(lastErr)}</code>`:''}。<br><br>可改用：<a class="btn btn-install" href="https://clawhub.ai/api/v1/download?slug=${encodeURIComponent(slug)}" target="_blank" rel="noopener">⬇ 直接一键安装</a></div>`;
    return;
  }
  try{
    const st=skill.stats||{},lv=skill.latestVersion||{},own=skill.owner||{};
    let chips=[];
    if(Array.isArray(skill.topics))chips=chips.concat(skill.topics);
    else if(Array.isArray(skill.tags))chips=chips.concat(skill.tags);
    else if(skill.tags&&Array.isArray(skill.tags.latest))chips=chips.concat(skill.tags.latest);
    const cat=(skill.metadata&&skill.metadata.openclaw&&skill.metadata.openclaw.category)||'';
    if(cat)chips.push('分类: '+cat);
    const ownerUrl=own.handle?('https://clawhub.ai/'+esc(own.handle)):'';
    const detailUrl='https://clawhub.ai/'+(own.handle?esc(own.handle)+'/':'')+'skills/'+encodeURIComponent(slug);
    const date=s=>s?new Date(s).toISOString().slice(0,10):'—';
    let authorHtml='—';
    if(own.handle){authorHtml='<a class="link" href="'+ownerUrl+'" target="_blank" rel="noopener">'+esc(own.displayName||own.handle)+'</a>';}
    let tagsHtml='';
    if(chips.length){tagsHtml='<div class="tags" style="margin-bottom:10px">'+chips.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>';}
    let changelogHtml='';
    if(lv.changelog){changelogHtml='<div class="m-row" style="margin-top:10px">最近更新日志：</div><pre class="mdpre" style="max-height:160px">'+esc(lv.changelog)+'</pre>';}
    document.querySelector('#detailPanel .dp-title span').textContent=skill.displayName||slug;
    dpBody.innerHTML=
      '<div class="m-row">作者 <b>'+authorHtml+'</b> · slug <b><code>'+esc(skill.slug||slug)+'</code></b></div>'+
      '<div class="m-stats">'+
        '<div class="m-stat">安装量<b>'+fmt(st.installs)+'</b></div>'+
        '<div class="m-stat">下载量<b>'+fmt(st.downloads)+'</b></div>'+
        '<div class="m-stat">Stars<b>'+fmt(st.stars)+'</b></div>'+
        '<div class="m-stat">版本<b>'+esc(lv.version||'—')+'</b></div>'+
        '<div class="m-stat">License<b>'+esc(lv.license||'—')+'</b></div>'+
      '</div>'+
      '<div class="desc" style="margin-bottom:10px">'+esc(skill.summary||'')+'</div>'+
      tagsHtml+
      '<div class="card-actions" style="margin:12px 0">'+
        '<a class="btn btn-install" href="https://clawhub.ai/api/v1/download?slug='+encodeURIComponent(skill.slug||slug)+'" target="_blank" rel="noopener">⬇ 一键安装（下载 zip）</a>'+
        '<a class="btn" href="'+esc(detailUrl)+'" target="_blank" rel="noopener">🔗 打开详情页</a>'+
      '</div>'+
      '<div class="m-row">创建 <b>'+date(skill.createdAt)+'</b> · 更新 <b>'+date(skill.updatedAt)+'</b> · 完整描述（SKILL.md 原文，'+((skill.description||'').length)+' 字符）</div>'+
      '<pre class="mdpre">'+esc(skill.description||'(无 description 字段)')+'</pre>'+
      changelogHtml;
  }catch(err){
    dpBody.innerHTML=`<div class="empty">⚠️ 渲染异常：<br><pre class="mdpre" style="max-height:200px">${esc(String((err&&err.stack)||err))}</pre></div>`;
  }
}
render();
</script></body></html>
