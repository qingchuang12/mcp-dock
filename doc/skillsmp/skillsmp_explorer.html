<script>
const DB=JSON.parse(document.getElementById('data').textContent);
const servers=DB.servers, cats=DB.categories;
document.getElementById('subline').textContent=`离线样例 ${servers.length} 条 · ${cats.length} 个分类(13组+62叶) · 快照 ${DB.snapshot}`;
document.getElementById('nTotal').textContent=servers.length;document.getElementById('nCat').textContent=cats.length;
const zhOf={};cats.forEach(c=>zhOf[c.slug]=c.zh||c.slug);
const cnt={};servers.forEach(s=>(s.categories||[]).forEach(c=>cnt[c]=(cnt[c]||0)+1));
const catSel=document.getElementById('cat');
cats.forEach(c=>{const o=document.createElement('option');o.value=c.slug;o.textContent=(c.group?`${c.slug} · ${c.zh} (组)`:`${c.slug} · ${c.zh} (${c.count})`);catSel.appendChild(o);});
const enumBox=document.getElementById('enum');
cats.filter(c=>cnt[c.slug]).forEach(c=>{const el=document.createElement('div');el.className='chip';el.innerHTML=`${c.slug} · ${c.zh} <b>${cnt[c.slug]}</b>`;el.onclick=()=>{catSel.value=c.slug;render();};enumBox.appendChild(el);});
const langSel=document.getElementById('lang');
[...new Set(servers.map(s=>s.lang).filter(Boolean))].sort().forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;langSel.appendChild(o);});
let page=1;const q=document.getElementById('q'),sort=document.getElementById('sort'),psize=document.getElementById('psize');
[q,catSel,langSel,sort,psize].forEach(el=>el.addEventListener('input',()=>{page=1;render();}));
function render(){
  const kw=q.value.trim().toLowerCase(),cat=catSel.value,lang=langSel.value;
  let list=servers.filter(s=>{
    if(cat&&!(s.categories||[]).includes(cat))return false;
    if(lang&&s.lang!==lang)return false;
    if(kw){const hay=(s.name+' '+s.author+' '+s.desc).toLowerCase();if(!hay.includes(kw))return false;}
    return true;});
  if(sort.value==='stars')list.sort((a,b)=>b.stars-a.stars);
  else if(sort.value==='recent')list.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  else list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  const ps=+psize.value,pages=Math.max(1,Math.ceil(list.length/ps));if(page>pages)page=pages;
  const slice=list.slice((page-1)*ps,page*ps);
  document.getElementById('subline').textContent=`匹配 ${list.length} 条 · 第 ${page}/${pages} 页 · 离线样例共 ${servers.length} 条`;
  const grid=document.getElementById('grid');grid.innerHTML=slice.length?'':'<div class="empty">没有匹配的结果（换个关键字或清空分类试试）</div>';
  slice.forEach(s=>{
    const c2=(s.categories_zh||[]).slice(0,2).map((z,i)=>`<span class="badge" title="${esc(s.categories[i])}">${esc(z)}</span>`).join('');
    const lg=s.lang?`<span class="badge lang">${esc(s.lang)}</span>`:'';
    const d=new Date(s.updatedAt);const dt=d instanceof Date&&!isNaN(d)?d.toISOString().slice(0,10):'';
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`<div><h3>${esc(s.name)}</h3>${lg}</div>
      <div class="meta"><span>★ <b>${s.stars.toLocaleString()}</b></span><span>作者 <b>${esc(s.author||'—')}</b></span>${dt?`<span>更新 <b>${dt}</b></span>`:''}</div>
      <div>${c2}</div><div class="desc">${esc(s.desc||'')}</div>
      ${s.skillUrl?`<a class="link" href="${esc(s.skillUrl)}" target="_blank" rel="noopener">${esc(s.skillUrl)}</a>`:''}`;
    grid.appendChild(card);});
  const pager=document.getElementById('pager');pager.innerHTML='';
  const mk=(label,pg,dis)=>{const b=document.createElement('button');b.textContent=label;b.disabled=dis;b.onclick=()=>{page=pg;render();};return b;};
  pager.appendChild(mk('上一页',page-1,page<=1));pager.appendChild(mk(`${page} / ${pages}`,page,true));pager.appendChild(mk('下一页',page+1,page>=pages));
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
render();
</script></body></html>
